name: Python package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # cache by requirements.txt

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-cache-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-cache-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install graphviz
        python -m pip install --upgrade pip
        pip install flake8 pytest pep8-naming
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        # FINAL FIX: We select all Flakes errors (F) but then specifically ignore
        # the ones related to unused imports (F401) and unused variables (F841).
        # This keeps critical checks like 'undefined name' (F821).
        flake8 --select="F" --ignore="F401,F841" minitorch/ tests/ project/

    - name: Test with pytest
      run: |
        echo "Module 0"
        pytest tests -x -m task0_1
        pytest tests -x -m task0_2
        pytest tests -x -m task0_3
        pytest tests -x -m task0_4
        echo "Module 1"
        pytest tests -x -m task1_1
        pytest tests -x -m task1_2
        pytest tests -x -m task1_3
        pytest tests -x -m task1_4
        echo "Module 2"
        pytest tests -x -m task2_1
        pytest tests -x -m task2_2
        pytest tests -x -m task2_3
        pytest tests -x -m task2_4
        echo "Module 3"
        pytest tests -x -m task3_1
        pytest tests -x -m task3_2
        pytest tests -x -m task3_3
        pytest tests -x -m task3_4
        echo "Module 4"
        pytest tests -x -m task4_1
        pytest tests -x -m task4_2
        pytest tests -x -m task4_3
        pytest tests -x -m task4_4